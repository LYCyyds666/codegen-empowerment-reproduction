[build-system]
requires = [
    "setuptools>=42",
    "torch>=2.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ["flash-attn"]


[project]
name = "codegen"
version = "0.1.0"
description = "A Python package for code generation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Evan Ellis" }
]
dependencies = [
    "accelerate==1.8.1",
    "vllm>=0.5",
    "torch>=2.6.0",
    "attrs==23.2.0",
    "bitsandbytes==0.45.1",
    "hydra-core==1.3.2",
    "gspread==6.2.0",
    "lm-format-enforcer==0.10.11",
    "matplotlib==3.9.2",
    "numpy<2",
    "oauth2client==4.1.3",
    "openai==1.68.2",
    "pandas==2.2.2",
    "peft==0.14.0",
    "plotly==6.0.0",
    "proto-plus==1.23.0",
    "protobuf==4.25.3",
    "py-cpuinfo==9.0.0",
    "tiktoken==0.7.0",
    "tqdm==4.67.1",
    "wandb==0.19.10",
    "datasets>=3.5.0",
    "trl==0.19.1",
    "omegaconf==2.3.0",
    "livecodebench",
    "transformers>=4.51.0, <5",
    "blobfile"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
livecodebench = { path = "LiveCodeBench", editable = true }

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

