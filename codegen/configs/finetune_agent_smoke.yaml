defaults:
  - training
  - _self_

sft:
  seed: 100
  max_seq_length: 4096

  num_train_epochs: 1
  max_steps: 2

  logging_steps: 1
  logging_strategy: "steps"
  log_level: "info"

  eval_strategy: "no"
  save_strategy: "no"

  bf16: true
  fp16: false
  packing: false

  learning_rate: 0.00001
  lr_scheduler_type: "cosine"
  weight_decay: 0.0
  warmup_ratio: 0.1
  max_grad_norm: 1.0

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  eval_accumulation_steps: 1

  gradient_checkpointing: false

  run_name: smoke_qwen3_06b
  output_dir: ${oc.env:CODEGEN_ROOT}/models/smoke_qwen3_06b
  overwrite_output_dir: true

  save_safetensors: true
  save_on_each_node: true

  fsdp: full_shard
  remove_unused_columns: false
  report_to: "none"

model:
  model_name_or_path: "/scratch/hhu49/97e911/models/Qwen3-0.6B"
  tokenizer_path: "/scratch/hhu49/97e911/models/Qwen3-0.6B"
  use_reentrant: false
  use_flash_attn: false

data:
  dataset_name: /scratch/hhu49/97e911/data/codegen_smoke.pkl
  add_special_tokens: false
  append_concat_token: false
  train_type: "sft"
  temperature: 1.0
  num_train_examples: 10
  test_split: 0.2
